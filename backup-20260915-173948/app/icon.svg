<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The Ji Sushi fish mark as a favicon.

    Same two brush strokes as components/fish-mark.tsx, so the tab icon and the
    mark on the page are the same drawing rather than two things that resemble
    each other.

    The source artwork is 974×460 — very wide. Centred on a square canvas with a
    solid sumi background, because a transparent 16px favicon of thin strokes
    disappears entirely against a dark browser theme.
  -->
  <rect width="1024" height="1024" fill="#0E0F11"/>
  <g transform="translate(25, 282)"
     fill="none" stroke="#C1AB7F" stroke-width="46"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 17 C70 90 120 155 168 225 C260 320 400 400 560 410 C720 400 860 330 954 225"/>
    <path d="M20 440 C70 370 120 300 168 225 C260 130 400 50 560 40 C720 50 860 120 954 225"/>
    <circle cx="831" cy="224.5" r="40" fill="#C1AB7F" stroke="none"/>
  </g>
</svg>
